# ⚠️ 这个文件不会被执行，可以直接删掉整个 workflows/ 目录。
#
# 原因：
#   1. GitHub 只识别 .github/workflows/ 目录，这里的 workflows/ 不会被读取，
#      所以这条定时任务从来没有跑过。
#   2. 就算挪到正确位置也没必要：Cloudflare Pages Functions 是无服务器函数，
#      不存在"休眠"一说，D1 数据库也不会自动暂停。只有长时间没人访问后
#      第一次请求会多几百毫秒冷启动，为此每 4 分钟 ping 一次并不划算
#      （GitHub 定时任务最小粒度是 5 分钟，且仓库 60 天没活动会被自动停用）。
#   3. 它 ping 的是 /api/menu，改造前那等于每次把整本小说下载一遍。
#
# 真正值得放进 .github/workflows/ 的是自动备份，见 .github/workflows/backup.yml。
# 需要可用性监控的话，用 UptimeRobot 或 Cloudflare 的 Health Check 打 /api/health。
