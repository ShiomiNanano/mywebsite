# Cloudflare Pages 配置
name = "daydream-cafe"
compatibility_date = "2024-11-01"

# 静态资源发布目录
pages_build_output_dir = "public"

# D1 数据库绑定（binding 名必须为 DB）
[[d1_databases]]
binding = "DB"
database_name = "daydream"
database_id = "9e1972d0-750a-43ca-81a9-14b503cae89a"

# R2 存储绑定（八音盒上传音频用，binding 名必须为 MUSIC）
[[r2_buckets]]
binding = "MUSIC"
bucket_name = "daydream-music"
