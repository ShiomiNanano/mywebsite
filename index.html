<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a3238">
<meta name="format-detection" content="telephone=no">
<title>绘空事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#f3ecdc;--card:#faf6ea;--ink:#2c2820;--ink-soft:#7a7263;--line:#ded2b8;
  --accent:#24424a;--accent-dark:#1a3238;--gold:#b9954f;--gold-soft:#d9c08a;
  --night:#12191b;--danger:#a34a3a;
  --font-serif:"Noto Serif SC","Songti SC",serif;
  --font-body:"Noto Sans SC","PingFang SC",sans-serif;
  --font-hand:"Ma Shan Zheng","Kaiti SC",cursive;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{font-family:var(--font-body);color:var(--ink);
  background:radial-gradient(1200px 600px at 20% -10%,rgba(255,255,255,.5),transparent 60%),var(--paper);
  line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
img{max-width:100%}
input,button,textarea,select{font:inherit}
#app{min-height:100vh}
.page{padding-bottom:118px}

/* ============ 顶部栏 ============ */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + var(--safe-top)) 16px 10px;background:rgba(243,236,220,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--font-serif)}
.brand-mark{font-size:22px;color:var(--gold)}
.brand-name{font-size:17px;font-weight:600;letter-spacing:1px}
.topbar-right{display:flex;align-items:center;gap:14px}
.topbar-item{font-size:14px;color:var(--ink-soft);min-height:44px;display:inline-flex;align-items:center}
.topbar-item.topbar-hide-mobile{display:none}
.topbar-avatar{display:block;border-radius:50%;border:2px solid transparent}

/* ============ 按钮 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 26px;border-radius:40px;
  border:1px solid transparent;font-family:var(--font-body);font-size:15px;cursor:pointer;transition:all .25s;
  letter-spacing:1px;min-height:44px;touch-action:manipulation}
.btn-primary{background:var(--accent);color:#f6efdd;box-shadow:0 6px 18px rgba(36,66,74,.25)}
.btn-ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border-color:rgba(163,74,58,.5)}
.btn-small{padding:6px 16px;font-size:13px;border-radius:20px;min-height:38px}
.btn-block{width:100%}
.btn-file{position:relative;overflow:hidden}

/* ============ 头像 ============ */
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;flex:none;
  background:var(--accent);color:#f6efdd;font-family:var(--font-serif);font-weight:600}
.avatar img{width:100%;height:100%;object-fit:cover}
.size-38{width:38px;height:38px;font-size:17px}.size-36{width:36px;height:36px;font-size:16px}
.size-56{width:56px;height:56px;font-size:24px}.size-96{width:96px;height:96px;font-size:40px}

/* ============ 书封面 ============ */
.landing{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(1000px 700px at 70% 20%,rgba(232,195,106,.12),transparent 60%),
  radial-gradient(900px 600px at 20% 90%,rgba(36,66,74,.5),transparent 60%),var(--night);
  perspective:1400px}
.cover-scene{display:flex;flex-direction:column;align-items:center;gap:30px;animation:rise 1.1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:translateY(0)}}
.book-cover{width:min(76vw,320px);height:auto;aspect-ratio:340/472;border-radius:6px 14px 14px 6px;
  background:linear-gradient(160deg,#27464e 0%,#16282d 70%);
  box-shadow:0 24px 60px rgba(0,0,0,.5),10px 0 26px rgba(0,0,0,.3),inset 0 0 60px rgba(0,0,0,.35);
  position:relative;transform-style:preserve-3d;transform-origin:left center;transition:transform .9s cubic-bezier(.6,.1,.2,1),opacity .9s}
.book-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;
  background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 70%);border-right:1px solid rgba(255,255,255,.08);z-index:2}
.cover-inner{position:relative;height:100%;padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  border:1px solid rgba(240,228,196,.35);border-radius:inherit}
.cover-top{font-family:var(--font-hand);font-size:16px;color:rgba(240,228,196,.85);letter-spacing:5px}
.cover-illus{width:100%}
.cover-illus svg{width:100%;height:auto;display:block}
.cover-title{font-family:var(--font-serif);font-size:48px;font-weight:700;color:#f2e7cf;letter-spacing:10px;text-shadow:0 3px 20px rgba(0,0,0,.4)}
.cover-sub{font-family:var(--font-serif);font-size:12px;color:var(--gold-soft);letter-spacing:5px}
.cover-line{width:70%;height:1px;background:linear-gradient(90deg,transparent,rgba(240,228,196,.7),transparent)}
.cover-bottom{font-family:var(--font-hand);font-size:15px;color:rgba(240,228,196,.8);letter-spacing:3px}
.book-cover.turning{transform:rotateY(-112deg);opacity:0}
.btn-cover{font-family:var(--font-hand);font-size:19px;letter-spacing:6px;color:#f2e7cf;background:transparent;
  border:1px solid rgba(240,228,196,.45);padding:12px 40px;border-radius:40px;cursor:pointer;min-height:52px;touch-action:manipulation}
@media (max-height:560px){.cover-scene{gap:16px}.book-cover{width:min(52vh,280px)}.btn-cover{padding:8px 32px;font-size:16px}}

/* ============ 通用页面头 ============ */
.page-head{text-align:center;padding:40px 16px 22px}
.page-head .eyebrow{display:block;font-family:var(--font-hand);font-size:18px;color:var(--gold);margin-bottom:8px;letter-spacing:4px}
.page-head h1{font-family:var(--font-serif);font-size:30px;font-weight:700;letter-spacing:5px}
.page-head p{color:var(--ink-soft);margin-top:8px;font-size:14px}
.breadcrumb{padding:14px 16px 0;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breadcrumb a:hover{color:var(--gold)}
.notfound{text-align:center;padding:100px 20px;color:var(--ink-soft);font-family:var(--font-serif);font-size:18px}

/* ============ 登录 ============ */
.login-page{min-height:100vh;display:flex;flex-direction:column}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 22px;box-shadow:0 20px 60px rgba(70,60,40,.12)}
.login-head{text-align:center;margin-bottom:26px}
.login-cat{font-size:34px;color:var(--gold)}
.login-head h2{font-family:var(--font-serif);font-size:26px;letter-spacing:4px;margin-top:6px}
.login-sub{color:var(--ink-soft);font-size:13px;margin-top:6px}
.login-tabs{display:flex;gap:10px;margin-bottom:22px}
.tab{flex:1;padding:9px;border:1px solid var(--line);background:transparent;border-radius:30px;font-size:14px;color:var(--ink-soft);cursor:pointer;min-height:44px}
.tab.active{background:var(--accent);color:#f6efdd;border-color:var(--accent)}
#loginForm label{display:block;font-size:13px;color:var(--ink-soft);margin:16px 0 6px}
#loginForm input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#fffdf7;font-size:16px;color:var(--ink);min-height:48px}
#loginForm input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,66,74,.12)}
#confirmRow{display:none}
#loginForm.register-mode #confirmRow{display:block}
.login-error{min-height:20px;margin-top:12px;color:var(--danger);font-size:13px}
#loginForm .btn{margin-top:14px}
.demo-tip{margin-top:24px;padding:14px 16px;background:#f5eeda;border:1px dashed var(--gold-soft);border-radius:10px;font-size:12px;color:var(--ink-soft)}
.demo-tip p{margin:4px 0}

/* ============ 书架 ============ */
.menu-hero{text-align:center;padding:40px 16px 22px}
.menu-greet{font-family:var(--font-serif);font-size:26px;letter-spacing:4px}
.menu-quote{margin-top:12px;color:var(--ink-soft);font-size:13.5px;font-family:var(--font-serif)}
.quote-author{display:block;margin-top:4px;font-size:12.5px;color:var(--gold)}
.menu-cards{max-width:880px;margin:24px auto 0;padding:0 16px;display:grid;grid-template-columns:1fr;gap:16px}
.menu-card{position:relative;display:flex;align-items:center;gap:14px;padding:22px 20px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);overflow:hidden;transition:transform .25s,box-shadow .25s;touch-action:manipulation}
.menu-main{background:linear-gradient(135deg,#24424a,#16282d);color:#f2e7cf;border-color:transparent;box-shadow:0 14px 36px rgba(22,40,45,.4)}
.menu-card-badge{position:absolute;top:0;left:0;padding:6px 16px;background:var(--gold);color:#2b2820;font-size:12px;font-weight:700;border-radius:0 0 12px 0;letter-spacing:2px}
.menu-card-content h3{font-family:var(--font-serif);font-size:20px;letter-spacing:3px}
.menu-main .menu-card-content h3{font-size:26px}
.menu-card-content p{font-size:13px;opacity:.8;margin-top:6px}
.menu-card-meta{display:inline-block;margin-top:14px;font-size:12.5px;opacity:.8;border:1px solid rgba(255,255,255,.35);padding:3px 12px;border-radius:20px}
.menu-card-icon{font-size:30px;color:var(--gold);flex:none}
.menu-main .menu-card-icon{font-size:38px}
.menu-card-arrow{margin-left:auto;font-size:26px;opacity:.7}

/* ============ 章节 / 节列表 ============ */
.chapter-list{max-width:680px;margin:26px auto 0;padding:0 16px;display:grid;gap:16px}
.chapter-card{display:flex;align-items:center;gap:14px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:60px;touch-action:manipulation}
.chapter-num{font-family:var(--font-hand);font-size:22px;color:var(--gold);min-width:84px}
.chapter-body h3{font-family:var(--font-serif);font-size:19px;letter-spacing:2px}
.chapter-body p{font-size:13px;color:var(--ink-soft);margin-top:4px}
.chapter-arrow{margin-left:auto;color:var(--gold);font-size:20px}
.section-list{max-width:680px;margin:24px auto 0;padding:0 16px;display:grid;gap:12px}
.section-card{display:flex;align-items:center;gap:18px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:56px;touch-action:manipulation}
.section-index{font-family:var(--font-hand);font-size:24px;color:var(--accent);min-width:42px;text-align:center}
.section-body h3{font-size:16.5px;font-family:var(--font-serif);letter-spacing:1px}
.section-body p{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.section-arrow{margin-left:auto;color:var(--gold)}

/* ============ 个人章 / 设定卡片 ============ */
.article-grid{max-width:760px;margin:26px auto 0;padding:0 16px;display:grid;grid-template-columns:1fr;gap:16px}
.article-card{padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;touch-action:manipulation}
.article-card .card-ico{font-size:26px;margin-bottom:12px;color:var(--gold)}
.article-card h3{font-family:var(--font-serif);font-size:20px;letter-spacing:2px}
.article-card p{font-size:13px;color:var(--ink-soft);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.article-card .card-meta{font-size:12px;color:var(--gold);margin-top:12px}

/* ============ 阅读页 ============ */
.reading{max-width:720px;margin:16px 12px 0;padding:32px 22px 34px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(70,60,40,.08);touch-action:pan-y}
.reading-head{text-align:center;margin-bottom:26px}
.reading-head .eyebrow{font-family:var(--font-hand);font-size:17px;color:var(--gold);letter-spacing:3px}
.reading-head h1{font-family:var(--font-serif);font-size:26px;letter-spacing:3px;margin-top:10px}
.reading-divider{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px;color:var(--gold-soft)}
.reading-divider::before,.reading-divider::after{content:"";height:1px;width:60px}
.reading-divider::before{background:linear-gradient(90deg,transparent,var(--gold-soft))}
.reading-divider::after{background:linear-gradient(90deg,var(--gold-soft),transparent)}
.reading-content{font-family:var(--font-serif)}
.reading-content p{margin:0 0 1.4em;line-height:2.05;text-align:justify;font-size:clamp(15.5px,4.6vw,17px);color:#33302a;text-indent:2em}
.reading-content .char-block p{text-indent:0}
.char-block{background:#faf5e7;border:1px solid #e8dcc0;border-radius:12px;padding:16px;margin-bottom:16px}
.char-name{font-size:18px;font-weight:700;color:var(--accent)}
.char-note{font-size:13px;color:var(--gold);margin-left:6px;font-family:var(--font-body);font-weight:500}
.char-meta{font-size:13px;color:var(--ink-soft);margin:6px 0 10px;font-family:var(--font-body)}
.char-desc{line-height:1.95}
.reading-foot{text-align:center;margin-top:20px;color:var(--gold);font-family:var(--font-hand);font-size:16px;letter-spacing:4px}
.reading-nav{display:flex;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px dashed var(--line)}
.reading-swipe-hint{display:block;text-align:center;font-size:12px;color:var(--ink-soft);margin-top:16px;opacity:.7}

/* ============ 留言 ============ */
.comments{max-width:720px;margin:26px auto 0;padding:0 12px}
.comments-title{font-family:var(--font-serif);font-size:21px;letter-spacing:2px;margin-bottom:16px}
.comments-count{font-size:13px;color:var(--gold)}
.comment-login-tip{background:var(--card);border:1px dashed var(--line);padding:18px;border-radius:12px;text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:16px}
.comment-form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px}
.comment-form-head{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-soft);margin-bottom:12px}
.comment-form textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fffdf7;padding:12px 14px;font-family:var(--font-body);font-size:16px;resize:vertical;min-height:84px}
.comment-form textarea:focus{outline:none;border-color:var(--accent)}
.comment-form-foot{text-align:right;margin-top:10px}
.comments-list{display:grid;gap:14px}
.comment{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.comment-name{font-weight:600;font-size:14px}
.comment-time{font-size:12px;color:var(--ink-soft)}
.comment-head{display:flex;align-items:baseline;gap:10px}
.comment-content{margin-top:6px;font-size:14.5px;line-height:1.8}
.comments-empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:30px 0}

/* ============ 个人中心 ============ */
.profile-card{max-width:520px;margin:28px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 22px;text-align:center}
.profile-card h2{font-family:var(--font-serif);font-size:26px;margin-top:14px;letter-spacing:3px}
.profile-role{display:inline-block;margin-top:8px;font-size:12px;background:rgba(36,66,74,.1);color:var(--accent);padding:3px 14px;border-radius:20px}
.profile-since{font-size:12.5px;color:var(--ink-soft);margin-top:10px}
.profile-avatar-edit{text-align:left;margin-top:30px;padding-top:24px;border-top:1px dashed var(--line)}
.profile-avatar-edit h3{font-size:16px;font-family:var(--font-serif)}
.profile-avatar-edit .hint{font-size:12.5px;color:var(--ink-soft);margin:6px 0 14px}
.avatar-edit-row{margin:10px 0}
.avatar-edit-row input[type=text]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fffdf7;font-size:16px;min-height:48px}
.avatar-preview{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:13px;color:var(--ink-soft)}
.profile-actions{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ============ 管理后台 ============ */
.admin-nav{display:flex;gap:8px;justify-content:center;margin-top:26px}
.admin-nav a{padding:8px 22px;border:1px solid var(--line);border-radius:30px;font-size:14px;color:var(--ink-soft);background:var(--card);min-height:44px;display:inline-flex;align-items:center}
.admin-nav a.active{background:var(--accent);color:#f6efdd;border-color:var(--accent)}
.admin-head{max-width:900px;margin:26px auto 14px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.admin-head h2{font-family:var(--font-serif);font-size:24px;letter-spacing:2px}
.admin-table-wrap{max-width:900px;margin:0 auto;padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.admin-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;min-width:620px}
.admin-table th,.admin-table td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.admin-table th{background:#f0e7d2;font-size:12px;color:var(--ink-soft);letter-spacing:1px}
.admin-table tr:last-child td{border-bottom:none}
.admin-table .td-title{font-family:var(--font-serif);max-width:180px;white-space:normal}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px}
.tag-main{background:rgba(36,66,74,.12);color:var(--accent)}
.tag-personal{background:rgba(185,149,79,.16);color:#8a6a2f}
.tag-settings{background:rgba(122,114,99,.14);color:var(--ink-soft)}
.admin-form-wrap{max-width:720px;margin:26px auto 0;padding:0 12px}
.admin-form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px}
.form-row{margin-bottom:20px}
.form-row label{display:block;font-size:13.5px;color:var(--ink-soft);margin-bottom:7px}
.form-row .hint{color:var(--gold)}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fffdf7;font-size:16px;font-family:var(--font-body);min-height:48px}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--accent)}
.form-row textarea{resize:vertical;line-height:1.8;min-height:200px}
.form-row.inline{display:flex;flex-direction:column;gap:0}
.form-row.inline>div{flex:1}
.denied{text-align:center;padding:100px 20px;color:var(--ink-soft);font-family:var(--font-serif);font-size:18px}

/* ============ 底部导航 ============ */
.bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(250,246,234,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom)}
.bottom-nav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0 7px;
  color:var(--ink-soft);font-size:11px;letter-spacing:1px;min-height:56px;touch-action:manipulation}
.bottom-nav .bn-item .bn-ico{font-size:19px;line-height:1}
.bottom-nav .bn-item.active{color:var(--accent);font-weight:700}
.bottom-nav .bn-item.active .bn-ico{color:var(--gold)}

/* ============ Toast ============ */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-bottom));transform:translate(-50%,20px);
  background:var(--accent);color:#f6efdd;padding:12px 26px;border-radius:40px;font-size:14px;opacity:0;
  pointer-events:none;transition:all .35s;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger)}
@media (max-width:360px){.reading{margin:12px 8px 0;padding:26px 18px 30px}.menu-card-content h3{font-size:18px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   单文件预览版：用 localStorage 模拟后端，数据保存在手机本地
   ============================================================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,type){let b=document.getElementById('toast');if(!b){b=document.createElement('div');b.id='toast';document.body.appendChild(b)}

信纸有一种光滑的触感，边缘裁得很整齐。她读完了一遍，有些犹豫。她把信折好放回信封，上楼的时候，看见走廊地板上的两碗饭还放在原处。一碗已经凉透了，另一碗也是。她把两碗饭收进厨房，倒掉，把碗洗干净，放回碗柜里。

寒雪将消的一天，午休的教室。

伊祈坐在靠窗的位置，打开便当盒。今天装的是玉子烧和一小撮盐渍海带。曉音端着便当盒从隔壁班溜过来，在她对面坐下，打开盖子看了一眼自己的菜，又看了一眼伊祈的。
“你的玉子烧看起来比我的好吃欸。”
伊祈不知道该怎么接这句话，就没有接。曉音也不在意，夹了一块自己便当里的炸鸡块放在伊祈的饭上，然后一边吃饭一边说起话来。说到码头附近那家咖啡馆，说那家店靠海，窗边能看到整片海岸线，阳光好的时候海面会反光。店名起得也怪，叫什么白日梦。
“放学要不要一起去呀？你肯定会喜欢的喔！”
伊祈嚼着那颗炸鸡块。有点凉了，但还挺好吃的。

她点了点头。

窗外的阳光落在两个人的课桌之间，把便当盒的边缘照出一小圈光晕。伊祈低下头，把饭粒一颗一颗夹起来送进嘴里。对面的曉音已经开始说起别的事了，声音轻快，一句接一句，没停过。

咖啡馆的门是深色木框的，挂着铃铛。推门进去的时候，铃铛响了一声。
里面暖黄色的灯光，有几张旧椅子，吧台后面站着一个穿围裙的年轻男人，正在擦杯子。曉音已经跟吧台后面的人打起了招呼——她好像跟谁都认识得快。
伊祈站在门槛边，没有立刻走进去。她看见靠窗的座位刚好空着，阳光透过玻璃落在桌面上，落在一只趴在窗台上睡觉的猫的影子旁。她忽然觉得，这个地方，好像可以让她安心地窝着。

曉音坐在她对面，点了一杯热奶茶，在菜单背面画了一朵歪歪扭扭的小花，然后推到她面前。

“咯，给你的哟。”

伊祈低头看了一会儿。她把那朵小花留了下来，没有擦掉。窗外的海正在退潮。海岸线向前延伸，露出平日被海水覆盖的沙滩。

她坐在窗边，第一次觉得自己不是在等待什么结束。`;

function publicUser(u){return {id:u.id,username:u.username,avatar:u.avatar,role:u.role,created_at:u.created_at}}
function byChapter(a,b){return (a.chapter_no-b.chapter_no)||(a.section_no-b.section_no)||(a.id-b.id)}
function articlePayload(db,a){
  const p={...a,content_text:htmlToPlain(a.content)};
  const list=a.category==='main'?db.articles.filter(x=>x.category==='main').sort(byChapter)
    :db.articles.filter(x=>x.category===a.category).sort((x,y)=>x.id-y.id);
  const i=list.findIndex(x=>x.id===a.id);
  p.prev_id=i>0?list[i-1].id:null; p.next_id=i<list.length-1?list[i+1].id:null;
  return p;
}
function buildArticle(db,body,base){
  const category=body.category, b=base||{};
  const content=plainToHtml((body.content||'').trim());
  if(category==='main'){
    const cn=parseInt(body.chapter_no,10), sn=parseInt(body.section_no,10);
    if(!cn||!sn)throw new Error('章号与节号必须为数字');
    const ct=(body.chapter_title||'').trim()||b.chapter_title||('第'+cn+'章');
    const st=(body.section_title||'').trim()||b.section_title||('第'+sn+'节');
    return {id:b.id||db.seq.article++,category,chapter_no:cn,chapter_title:ct,section_no:sn,section_title:st,title:st,content,created_at:b.created_at||now(),updated_at:now()};
  }
  const t=(body.title||'').trim()||b.title||'未命名';
  return {id:b.id||db.seq.article++,category,chapter_no:null,chapter_title:null,section_no:null,section_title:null,title:t,content,created_at:b.created_at||now(),updated_at:now()};
}

function mockApi(method,url,body){
  const path=url.replace(/^\/api/,'');
  const db=loadDB();
  const s=JSON.parse(store.getItem(SESSION_KEY)||'null');
  const me=s?db.users.find(u=>u.id===s.userId)||null:null;
  const needUser=()=>{if(!me)throw new Error('请先登录')};
  const needAdmin=()=>{needUser();if(me.role!=='admin')throw new Error('需要管理员权限')};

  if(method==='POST'&&path==='/login'){
    const u=db.users.find(x=>x.username===body.username&&x.password===body.password);
    if(!u)throw new Error('用户名或密码错误');
    store.setItem(SESSION_KEY,JSON.stringify({userId:u.id}));
    return {ok:true,user:publicUser(u)};
  }
  if(method==='POST'&&path==='/register'){
    const name=(body.username||'').trim();
    if(!/^[\w\u4e00-\u9fff]{2,20}$/.test(name))throw new Error('用户名需为2-20位的中文、字母、数字或下划线');
    if((body.password||'').length<4)throw new Error('密码至少4位');
    if(db.users.some(x=>x.username===name))throw new Error('用户名已存在');
    const u={id:db.seq.user++,username:name,password:body.password,avatar:'',role:'user',created_at:now()};
    db.users.push(u);saveDB(db);
    store.setItem(SESSION_KEY,JSON.stringify({userId:u.id}));
    return {ok:true,user:publicUser(u)};
  }
  if(method==='POST'&&path==='/logout'){store.removeItem(SESSION_KEY);return {ok:true}}
  if(method==='GET'&&path==='/me')return {user:me?publicUser(me):null};
  if(method==='PUT'&&path==='/me/avatar'){
    needUser();me.avatar=(body.avatar||'').trim();saveDB(db);
    return {ok:true,user:publicUser(me)};
  }
  if(method==='GET'&&path==='/menu'){
    const main=[],mmap={},personal=[],settings=[];
    const cmt=id=>db.comments.filter(c=>c.article_id===id).length;
    [...db.articles].sort(byChapter).forEach(a=>{
      const it={...a,comment_count:cmt(a.id)};
      if(a.category==='main'){
        const k=a.chapter_no+'|'+a.chapter_title;
        if(!mmap[k]){mmap[k]={chapter_no:a.chapter_no,chapter_title:a.chapter_title,sections:[]};main.push(mmap[k])}
        mmap[k].sections.push(it);
      }else if(a.category==='personal')personal.push(it);
      else settings.push(it);
    });
    return {main,personal,settings};
  }
  let m=path.match(/^\/article\/(\d+)$/);
  if(method==='GET'&&m){
    const a=db.articles.find(x=>x.id===Number(m[1]));
    if(!a)throw new Error('文章不存在');
    return articlePayload(db,a);
  }
  m=path.match(/^\/article\/(\d+)\/comments$/);
  if(method==='GET'&&m){
    return db.comments.filter(c=>c.article_id===Number(m[1])).sort((a,b)=>a.id-b.id).map(c=>({...c}));
  }
  if(method==='POST'&&m){
    needUser();
    const content=(body.content||'').trim();
    if(!content)throw new Error('留言不能为空');
    if(content.length>2000)throw new Error('留言过长（最多2000字）');
    const c={id:db.seq.comment++,article_id:Number(m[1]),user_id:me.id,username:me.username,avatar:me.avatar||'',content,created_at:now()};
    db.comments.push(c);saveDB(db);
    return {...c};
  }
  if(method==='GET'&&path==='/admin/articles'){needAdmin();return db.articles.map(a=>articlePayload(db,a))}
  m=path.match(/^\/admin\/articles\/(\d+)$/);
  if(method==='GET'&&m){needAdmin();const a=db.articles.find(x=>x.id===Number(m[1]));if(!a)throw new Error('文章不存在');return articlePayload(db,a)}
  if(method==='POST'&&path==='/admin/articles'){needAdmin();const a=buildArticle(db,body,null);db.articles.push(a);saveDB(db);return articlePayload(db,a)}
  if(method==='PUT'&&m){needAdmin();const i=db.articles.findIndex(x=>x.id===Number(m[1]));if(i<0)throw new Error('文章不存在');db.articles[i]=buildArticle(db,body,db.articles[i]);saveDB(db);return articlePayload(db,db.articles[i])}
  if(method==='DELETE'&&m){needAdmin();const id=Number(m[1]);db.articles=db.articles.filter(x=>x.id!==id);db.comments=db.comments.filter(c=>c.article_id!==id);saveDB(db);return {ok:true}}
  if(method==='GET'&&path==='/admin/users'){needAdmin();return db.users.map(u=>({id:u.id,username:u.username,role:u.role,created_at:u.created_at}))}
  m=path.match(/^\/admin\/users\/(\d+)$/);
  if(method==='PUT'&&m){needAdmin();const u=db.users.find(x=>x.id===Number(m[1]));if(!u)throw new Error('用户不存在');if(u.id===me.id)throw new Error('不能修改自己的角色');u.role=body.role;saveDB(db);return {ok:true}}
  if(method==='DELETE'&&m){needAdmin();const u=db.users.find(x=>x.id===Number(m[1]));if(!u)throw new Error('用户不存在');if(u.id===me.id)throw new Error('不能删除自己');db.users=db.users.filter(x=>x.id!==u.id);db.comments.forEach(c=>{if(c.user_id===u.id){c.username='已注销';c.avatar='';c.user_id=null}});saveDB(db);return {ok:true}}
  throw new Error('未知请求');
}

const API={
  request(method,url,body){
    try{return Promise.resolve(mockApi(method,url,body))}
    catch(e){return Promise.reject(e instanceof Error?e:new Error('请求失败'))}
  },
  get:url=>API.request('GET',url),
  post:(url,body)=>API.request('POST',url,body),
  put:(url,body)=>API.request('PUT',url,body),
  del:url=>API.request('DELETE',url)
};

function bindSwipe(el){
  if(!el)return;let sx=null,sy=null;
  el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  el.addEventListener('touchend',e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    sx=null;sy=null;
    if(Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.4){
      const prev=el.dataset.prev,next=el.dataset.next;
      if(dx<0&&next)location.hash='#/read/'+next;
      else if(dx>0&&prev)location.hash='#/read/'+prev;
    }
  },{passive:true});
}

    try{const {user}=await API.get('/api/me');this.state.user=user}catch(e){}
    window.addEventListener('hashchange',()=>this.route());
    this.route();
  },
  async route(){
    const hash=location.hash.replace(/^#/,'')||'/';
    const parts=hash.split('/').filter(Boolean);
    let view='';
    try{
      if(parts.length===0)view=this.renderLanding();
      else if(parts[0]==='login')view=this.renderLogin();
      else if(parts[0]==='menu')view=await this.renderMenu();
      else if(parts[0]==='main')view=parts.length>=2?await this.renderChapter(parts[1]):await this.renderMainList();
      else if(parts[0]==='personal')view=await this.renderPersonal();
      else if(parts[0]==='settings')view=await this.renderSettings();
      else if(parts[0]==='read')view=await this.renderRead(parts[1]);
      else if(parts[0]==='profile')view=this.renderProfile();
      else if(parts[0]==='admin'){
        const sub=parts[1];
        if(sub==='new')view=await this.renderAdminForm();
        else if(sub==='edit')view=await this.renderAdminForm(parts[2]);

    }catch(e){view=`<div class="page">${this.topbar()}<div class="notfound">${esc(e.message)}</div></div>`}
    const isOutside=parts.length===0||parts[0]==='login';
    const showNav=this.state.user&&!isOutside;
    const active=!showNav?'':(['menu','main','personal','settings'].includes(parts[0])?parts[0]:'');
    document.getElementById('app').innerHTML=view+(showNav?this.bottomNav(active):'');
    window.scrollTo(0,0);
    this.afterRender();
  },
  bottomNav(active){
    const item=(key,ico,txt)=>`<a class="bn-item ${active===key?'active':''}" href="#/${key}"><span class="bn-ico">${ico}</span><span class="bn-txt">${txt}</span></a>`;
    return `<nav class="bottom-nav">${item('menu','☾','书架')}${item('main','☂','主线')}${item('personal','✉','个人')}${item('settings','❖','设定')}</nav>`;
  },
  avatarHtml(user,size){
    const cls=`avatar size-${size||38}`;
    if(user&&user.avatar)return `<img class="${cls}" src="${esc(user.avatar)}" alt="">`;
    const initial=user?(user.username||'?').charAt(0):'?';
    return `<div class="${cls} avatar-initial">${esc(initial)}</div>`;
  },
  topbar(){
    const u=this.state.user;
    return `<header class="topbar">
      <a class="brand" href="#/menu"><span class="brand-mark">☾</span><span class="brand-name">白日梦咖啡馆</span></a>
      <div class="topbar-right">${u?`
        <a class="topbar-item topbar-hide-mobile" href="#/menu">书架</a>
        ${u.role==='admin'?`<a class="topbar-item" href="#/admin/articles">管理</a>`:''}
        <a href="#/profile" class="topbar-avatar" title="${esc(u.username)}">${this.avatarHtml(u,38)}</a>`
        :`<a class="btn btn-small btn-ghost" href="#/login">登录</a>`}
      </div></header>`;
  },
  async ensureMenu(){if(!this.state.menu)this.state.menu=await API.get('/api/menu');return this.state.menu},
  excerpt(a){const t=(a.content||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();return t.length>42?t.slice(0,42)+'…':t},

    </div></div>`;
  },

  renderLogin(){

      <div class="login-wrap"><div class="login-card">
        <div class="login-head"><div class="login-cat">☾</div><h2>白日梦咖啡馆</h2><p class="login-sub">欢迎回来 · 请选择你的座位</p></div>

          <label>密码</label><input name="password" type="password" placeholder="至少4位" autocomplete="current-password" required>
          <div id="confirmRow"><label>确认密码</label><input name="confirmPassword" type="password" placeholder="再次输入密码"></div>

        <p style="color:var(--gold)">※ 预览版数据仅保存在手机本地</p></div>
      </div></div></div>`;

      <div class="admin-head"><h2>用户管理</h2></div>
      <div class="admin-table-wrap"><table class="admin-table">
        <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>加入时间</th><th>操作</th></tr></thead>
        <tbody>${users.map(x=>`<tr>
          <td>${x.id}</td><td>${esc(x.username)}</td>
          <td>${x.role==='admin'?'<span class="tag tag-main">管理员</span>':'<span class="tag tag-personal">用户</span>'}</td>

          <td>${x.username===this.state.user.username?'<span class="hint">（当前账号）</span>':`
            <button class="btn btn-small btn-ghost" data-action="set-role" data-id="${x.id}" data-role="${x.role==='admin'?'user':'admin'}">${x.role==='admin'?'设为用户':'设为管理员'}</button>

  afterRender(){
    const openBtn=document.getElementById('openBook');
    if(openBtn)openBtn.onclick=()=>{document.getElementById('bookCover').classList.add('turning');
      setTimeout(()=>{location.hash=this.state.user?'#/menu':'#/login'},900)};
    document.querySelectorAll('[data-tab]').forEach(t=>{t.onclick=()=>this.switchAuthTab(t.dataset.tab)});
    const lf=document.getElementById('loginForm');if(lf)lf.onsubmit=e=>this.handleLogin(e);
    const cf=document.querySelector('.comment-form');if(cf)cf.onsubmit=e=>this.handleComment(e);
    const sa=document.getElementById('saveAvatar');if(sa)sa.onclick=()=>this.handleSaveAvatar();
    const ca=document.getElementById('clearAvatar');if(ca)ca.onclick=()=>this.handleClearAvatar();
    const af=document.getElementById('avatarFile');if(af)af.onchange=e=>this.handleAvatarFile(e);
    const lo=document.getElementById('logoutBtn');if(lo)lo.onclick=()=>this.handleLogout();
    const rd=document.getElementById('resetData');if(rd)rd.onclick=()=>this.handleReset();
    const adm=document.getElementById('adminForm');if(adm)adm.onsubmit=e=>this.handleAdminForm(e);
    const cs=document.getElementById('articleCategory');
    if(cs)cs.onchange=()=>{const im=cs.value==='main';
      document.getElementById('mainFields').style.display=im?'':'none';
      document.getElementById('titleRow').style.display=im?'none':''};
    bindSwipe(document.querySelector('.reading'));
  },

  switchAuthTab(tab){
    this.authMode=tab;
    document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
    const f=document.getElementById('loginForm');
    f.classList.toggle('register-mode',tab==='register');
    f.querySelector('button[type=submit]').textContent=tab==='register'?'创建账号，进入咖啡馆':'进入咖啡馆';
    document.getElementById('loginError').textContent='';
  },

  async handleLogin(e){
    e.preventDefault();const f=e.target,err=document.getElementById('loginError');
    try{
      if(this.authMode==='register'){
        if(f.password.value!==f.confirmPassword.value)throw new Error('两次输入的密码不一致');
        await API.post('/api/register',{username:f.username.value.trim(),password:f.password.value});
        toast('账号已创建，欢迎来到白日梦咖啡馆');
      }else{await API.post('/api/login',{username:f.username.value.trim(),password:f.password.value});toast('欢迎回来，'+f.username.value.trim())}
      const{user}=await API.get('/api/me');this.state.user=user;location.hash='#/menu';
    }catch(e){err.textContent=e.message}
  },

  async handleComment(e){
    e.preventDefault();const f=e.target;
    try{await API.post('/api/article/'+f.dataset.article+'/comments',{content:f.content.value.trim()});
      toast('留言已发布');this.state.menu=null;this.route()}
    catch(e){toast(e.message,'err')}
  },

  handleAvatarFile(e){
    const file=e.target.files[0];if(!file)return;
    if(file.size>2*1024*1024){toast('图片请小于 2MB','err');return}
    const r=new FileReader();r.onload=()=>{this.pendingAvatar=r.result;toast('已读取图片，点击“保存头像”生效')};r.readAsDataURL(file);
  },
  async handleSaveAvatar(){
    let avatar=(document.getElementById('avatarUrl').value||'').trim();if(this.pendingAvatar)avatar=this.pendingAvatar;
    try{const{user}=await API.put('/api/me/avatar',{avatar});this.state.user=user;this.pendingAvatar=null;toast('头像已更新');this.route()}
    catch(e){toast(e.message,'err')}
  },
  async handleClearAvatar(){
    try{const{user}=await API.put('/api/me/avatar',{avatar:''});this.state.user=user;toast('已恢复默认头像');this.route()}
    catch(e){toast(e.message,'err')}
  },
  async handleLogout(){await API.post('/api/logout');this.state.user=null;this.state.menu=null;toast('已退出，期待下次见面');location.hash='#/'},
  handleReset(){
    store.removeItem(DB_KEY);store.removeItem(SESSION_KEY);
    this.state.user=null;this.state.menu=null;
    toast('演示数据已重置');location.hash='#/';this.route();
  },

  async handleAdminForm(e){
    e.preventDefault();const f=e.target,id=f.dataset.id||null,category=f.category.value;
    const p={category,content:f.content.value.trim()};
    if(category==='main'){p.chapter_no=parseInt(f.chapter_no.value,10);p.chapter_title=f.chapter_title.value.trim();
      p.section_no=parseInt(f.section_no.value,10);p.section_title=f.section_title.value.trim()}
    else p.title=f.title.value.trim();
    try{
      if(id){await API.put('/api/admin/articles/'+id,p);toast('文章已更新')}
      else{await API.post('/api/admin/articles',p);toast('文章已发布')}
      this.state.menu=null;location.hash='#/admin/articles';
    }catch(e){toast(e.message,'err')}
  }
};

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const action=el.dataset.action,id=el.dataset.id;
  if(action==='edit-article'){location.hash='#/admin/edit/'+id;return}
  if(action==='delete-article'){if(confirm('确定删除这篇文章吗？')){try{await API.del('/api/admin/articles/'+id);App.state.menu=null;toast('已删除');location.hash='#/admin/articles'}catch(e){toast(e.message,'err')}}return}
  if(action==='set-role'){if(confirm('确定将该用户角色设为「'+(el.dataset.role==='admin'?'管理员':'普通用户')+'」吗？')){try{await API.put('/api/admin/users/'+id,{role:el.dataset.role});toast('已更新');location.hash='#/admin/users'}catch(e){toast(e.message,'err')}}return}
  if(action==='delete-user'){if(confirm('确定删除该用户吗？其留言将保留并标记为“已注销”。')){try{await API.del('/api/admin/users/'+id);toast('已删除');location.hash='#/admin/users'}catch(e){toast(e.message,'err')}}return}
});

document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
</body>
</html>
